name: tests

# Runs the Qubes-free layers of the SEQS test harness (lint, salt render,
# bash units, mock-dom0 integration) on every push / PR. None of this needs a
# real Qubes machine -- see test/README.md for the hardware-bound Layer 5.

on:
  push:
  pull_request:

# The tests only read the repository.
permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned to a commit

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, pinned to a commit
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade jinja2 pyyaml
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run test harness
        run: ./test/run-tests.sh
